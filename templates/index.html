<!DOCTYPE html>
<html>
<head>
    <title>Menu Utama</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }
        .container {
            width: 400px;
            margin: 80px auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            margin-bottom: 12px;
        }
        a {
            display: block;
            text-decoration: none;
            background: #2d89ef;
            color: white;
            padding: 10px;
            text-align: center;
            border-radius: 5px;
            font-weight: bold;
        }
        a:hover {
            background: #1b5fa7;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>MENU UTAMA</h2>
    <ul>
        <li><a href="/biodata">Biodata</a></li>
        <li><a href="/sks">Input SKS</a></li>
        <li><a href="/nilai">Input Nilai</a></li>
        <li><a href="/lihat-nilai">Lihat Nilai</a></li>
        <li><a href="/lihat-ip">Lihat IP</a></li>
    </ul>
</div>

</body>
</html>
