<!DOCTYPE html>
<html>
<head>
    <title>Lihat IPS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
        }
        .container {
            width: 420px;
            margin: 80px auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
        }
        .hasil {
            font-size: 18px;
            margin: 20px 0;
        }
        .kosong {
            color: #d9534f;
            font-weight: bold;
        }
        .back a {
            text-decoration: none;
            color: #2d89ef;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>HASIL IPS</h2>

    <div class="hasil">
        {% if ips is not none %}
            <p>IPS Anda:</p>
            <p style="font-size:28px;"><b>{{ ips }}</b></p>
        {% else %}
            <p class="kosong">Nilai masih kosong</p>
        {% endif %}
    </div>

    <div class="back">
        <a href="/">⬅ Kembali ke Menu</a>
    </div>
</div>

</body>
</html>
